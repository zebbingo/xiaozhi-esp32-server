<head>
  <meta charset="UTF-8">

  <title>隐私政策</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Open Sans','Helvetica Neue',sans-serif; margin: 0; padding: 20px; line-height: 1.6; background-color: #f5f7fa; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    h1 { color: #409EFF; }
  </style>

<body>
<div class="container">
<h1>隐私政策</h1>
<p>本隐私政策旨在说明小智控制台在您使用过程中如何收集、使用及保存您的个人信息。</p>
<h2>数据收集</h2>
<ul>
<li>注册及登录信息，如用户名、手机号、验证码等。</li>
<li>设备和日志信息，用于保障服务稳定性。</li>
</ul>
<h2>数据用途</h2>
<ul>
<li>为您提供身份验证、账号管理等服务。</li>
<li>改进产品功能和服务体验。</li>
</ul>
<h2>数据存储与保护</h2>
<ul>
<li>仅在实现上述目的所必需的期间内保存数据，法律法规另有规定的除外。</li>
<li>采取合理的安全措施防止数据被未经授权访问、披露或丢失。</li>
</ul>
<h2>联系我们</h2>
<p>如您对本政策有任何疑问，可通过项目仓库提交 issue 与我们联系。</p>
</div>
</body>
